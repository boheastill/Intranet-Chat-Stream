<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intranet Chat Stream (ICS)</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d11;
            --surface-color: #151821;
            --surface-card: #1c202d;
            --border-color: #2b3245;
            --border-hover: #3b455f;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --pin-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(21, 24, 33, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2rem;
            height: 2rem;
            background: var(--primary-grad);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #ffffff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
            position: relative;
        }

        .status-dot.error {
            background-color: var(--danger-color);
            box-shadow: 0 0 8px var(--danger-color);
        }

        .status-dot.pulse::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid var(--success-color);
            animation: pulse 1.5s infinite ease-out;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* Main Workspace Container */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* Message Stream Timeline */
        .timeline-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding-bottom: 12rem; /* space for input center */
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60%;
            color: var(--text-secondary);
            text-align: center;
            gap: 1rem;
        }

        .empty-state svg {
            width: 4rem;
            height: 4rem;
            stroke: var(--border-color);
            margin-bottom: 0.5rem;
        }

        /* Message Bubble Cards */
        .message-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.3s ease-out;
            max-width: 85%;
            align-self: flex-start;
        }

        .message-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transform: translateY(-2px);
        }

        .message-card.pinned {
            border-left: 4px solid var(--pin-color);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.05);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card Header (Meta Info) */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.5rem;
            gap: 2rem;
        }

        .meta-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .type-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
        }

        .type-badge.text {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.1);
        }

        .type-badge.file {
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }

        .meta-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Card Content Box */
        .card-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-primary);
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* Text copy area */
        .text-content-box {
            position: relative;
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 0.5rem;
            padding: 1rem;
            font-family: inherit;
        }

        /* File UI Container */
        .file-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }

        .file-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-primary);
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-name:hover {
            text-decoration: underline;
            color: #34d399;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }

        /* Image preview card */
        .image-preview {
            max-width: 100%;
            max-height: 320px;
            border-radius: 0.5rem;
            margin-top: 0.25rem;
            border: 1px solid var(--border-color);
            object-fit: contain;
            cursor: pointer;
            transition: opacity 0.2s;
            display: block;
        }

        .image-preview:hover {
            opacity: 0.85;
        }

        /* Card Actions (Bottom Options) */
        .card-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.35rem 0.7rem;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-action.pin-btn:hover {
            color: var(--pin-color);
            border-color: rgba(245, 158, 11, 0.4);
            background: rgba(245, 158, 11, 0.05);
        }

        .btn-action.delete-btn:hover {
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Bottom Control Panel */
        .input-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            background: linear-gradient(to top, var(--bg-color) 70%, transparent 100%);
            z-index: 50;
        }

        .input-box-wrapper {
            background: rgba(21, 24, 33, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1.2rem;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.4);
        }

        .input-box-wrapper:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15);
        }

        .text-textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            height: 50px;
            max-height: 150px;
            line-height: 1.5;
        }

        .text-textarea::placeholder {
            color: var(--text-secondary);
        }

        .panel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 0.5rem;
        }

        /* File drop & attachment area */
        .attachment-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
        }

        .attachment-indicator:hover {
            color: var(--text-primary);
        }

        .file-input {
            display: none;
        }

        .attached-file-badge {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #34d399;
            padding: 0.25rem 0.5rem;
            border-radius: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
        }

        .btn-clear-attachment {
            cursor: pointer;
            border: none;
            background: transparent;
            color: #34d399;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Action Buttons */
        .submit-btn {
            background: var(--primary-grad);
            border: none;
            color: white;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
        }

        .submit-btn:hover {
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Progress Bar Overlay */
        .progress-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 1.2rem;
            border-bottom-right-radius: 1.2rem;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-grad);
            transition: width 0.1s ease;
        }

        /* Lightbox Image Overlay */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .lightbox.show {
            display: flex;
            opacity: 1;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 0.5rem;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .lightbox.show .lightbox-img {
            transform: scale(1);
        }

        /* Drop Zone indicator */
        .drag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(99, 102, 241, 0.15);
            border: 2px dashed #6366f1;
            border-radius: 1rem;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .drag-overlay-card {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-section">
            <div class="logo-icon">C</div>
            <h1 class="logo-title">Intranet Chat Stream</h1>
        </div>
        <div class="status-section">
            <div id="statusDot" class="status-dot pulse"></div>
            <span id="statusText">正在同步...</span>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="container">
        <!-- Message list timeline -->
        <main id="timeline" class="timeline-container">
            <div class="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                </svg>
                <p>暂无消息流。您可以粘贴剪贴板文字或拖入文件开始。</p>
            </div>
        </main>

        <!-- Drag Over Overlay -->
        <div id="dragOverlay" class="drag-overlay">
            <div class="drag-overlay-card">
                <h3 style="color:#818cf8; margin-bottom: 0.5rem;">拖放上传文件</h3>
                <p style="color:var(--text-secondary); font-size: 0.9rem;">释放鼠标以安全投送至云流中</p>
            </div>
        </div>

        <!-- Input Center Panel -->
        <div class="input-panel">
            <form id="pushForm">
                <div class="input-box-wrapper">
                    <textarea id="textInput" class="text-textarea" placeholder="输入或粘贴文本 (Ctrl + Enter 投送)..."></textarea>
                    
                    <div class="panel-footer">
                        <!-- File Upload Indicator -->
                        <div class="attachment-section">
                            <label for="fileInput" class="attachment-indicator" id="attachmentLabel">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="margin-right: 0.25rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                                </svg>
                                <span>选择/拖入文件</span>
                            </label>
                            <input type="file" id="fileInput" class="file-input">
                            <div id="fileBadgeContainer" style="display: none; margin-top: 0.25rem;">
                                <div class="attached-file-badge">
                                    <span id="attachedFileName" style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">filename.txt</span>
                                    <button type="button" id="btnClearAttachment" class="btn-clear-attachment">&times;</button>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-btn">
                            <span>投送</span>
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Upload Progress Overlay -->
                    <div class="progress-overlay" id="progressOverlay">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Lightbox Image Modal -->
    <div id="lightbox" class="lightbox">
        <img id="lightboxImg" class="lightbox-img" src="" alt="Full Screen Preview">
    </div>

    <!-- Security Authentication Modal Overlay -->
    <div id="loginModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 13, 17, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 1.5rem; padding: 2.5rem; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="logo-icon" style="margin: 0 auto; width: 3.5rem; height: 3.5rem; font-size: 1.6rem; border-radius: 0.8rem;">C</div>
            <h2 id="loginTitle" style="font-size: 1.4rem; font-weight: 600; background: linear-gradient(to right, #ffffff, var(--text-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">需要访问密钥</h2>
            <p id="loginSubtitle" style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4;">请输入此云流的安全 Token 进行同步认证</p>
            
            <!-- Token input view -->
            <div id="tokenInputContainer" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
                <input type="password" id="tokenField" style="width: 100%; background: var(--surface-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.8rem 1rem; border-radius: 0.75rem; font-size: 1.1rem; text-align: center; outline: none; font-family: monospace; transition: border-color 0.2s;" placeholder="••••••••••••••••">
            </div>

            <!-- Email & Password input view -->
            <div id="emailInputContainer" style="width: 100%; display: none; flex-direction: column; gap: 1rem;">
                <input type="email" id="emailField" style="width: 100%; background: var(--surface-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.8rem 1rem; border-radius: 0.75rem; font-size: 1rem; text-align: center; outline: none; transition: border-color 0.2s;" placeholder="密保邮箱">
                <input type="password" id="passwordField" style="width: 100%; background: var(--surface-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.8rem 1rem; border-radius: 0.75rem; font-size: 1rem; text-align: center; outline: none; transition: border-color 0.2s;" placeholder="访问密码">
            </div>

            <button id="btnLogin" class="submit-btn" style="width: 100%; justify-content: center; padding: 0.8rem 1rem; font-size: 0.95rem; border-radius: 0.75rem;">验证并进入</button>
            
            <div style="margin-top: 0.5rem;">
                <a href="#" id="toggleLoginMode" style="color: var(--text-secondary); font-size: 0.8rem; text-decoration: underline; cursor: pointer; transition: color 0.2s;">使用邮箱密码登录</a>
            </div>
        </div>
    </div>

    <script>
        const timeline = document.getElementById('timeline');
        const pushForm = document.getElementById('pushForm');
        const textInput = document.getElementById('textInput');
        const fileInput = document.getElementById('fileInput');
        const fileBadgeContainer = document.getElementById('fileBadgeContainer');
        const attachedFileName = document.getElementById('attachedFileName');
        const btnClearAttachment = document.getElementById('btnClearAttachment');
        const progressOverlay = document.getElementById('progressOverlay');
        const progressBar = document.getElementById('progressBar');
        const dragOverlay = document.getElementById('dragOverlay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        const loginModal = document.getElementById('loginModal');
        const tokenField = document.getElementById('tokenField');
        const emailField = document.getElementById('emailField');
        const passwordField = document.getElementById('passwordField');
        const btnLogin = document.getElementById('btnLogin');

        let token = '';
        let lastListHash = '';
        let isPolling = false;
        let pollingInterval = null;
        let loginMode = 'token'; // 'token' or 'email'

        // Initialize Authentication flow
        initAuth();

        function initAuth() {
            // 1. Intercept Token in URL query parameter (for automatic setups or one-click links)
            const urlParams = new URLSearchParams(window.location.search);
            const tokenParam = urlParams.get('token');
            if (tokenParam) {
                localStorage.setItem('ics_token', tokenParam);
                // Wipe token from browser address bar immediately for security history protection
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // Detect if emergency login or special login page is requested via URL parameter
            const loginParam = urlParams.get('login');
            const emergencyParam = urlParams.get('emergency');
            const showEmailLogin = loginParam === '1' || emergencyParam === '1' || emergencyParam === 'true';

            // 2. Load token from localStorage
            token = localStorage.getItem('ics_token');

            if (!token) {
                // If not authenticated, show password overlay modal
                loginModal.style.display = 'flex';
                
                if (showEmailLogin) {
                    setLoginMode('email');
                } else {
                    setLoginMode('token');
                }

                // Set up submission hooks
                btnLogin.onclick = handleLoginSubmit;
                tokenField.onkeydown = e => {
                    if (e.key === 'Enter') handleLoginSubmit();
                };
                emailField.onkeydown = e => {
                    if (e.key === 'Enter') passwordField.focus();
                };
                passwordField.onkeydown = e => {
                    if (e.key === 'Enter') handleLoginSubmit();
                };

                document.getElementById('toggleLoginMode').onclick = (e) => {
                    e.preventDefault();
                    setLoginMode(loginMode === 'token' ? 'email' : 'token');
                };
            } else {
                startService();
            }
        }

        function setLoginMode(mode) {
            loginMode = mode;
            const tokenContainer = document.getElementById('tokenInputContainer');
            const emailContainer = document.getElementById('emailInputContainer');
            const toggleLink = document.getElementById('toggleLoginMode');
            const loginTitle = document.getElementById('loginTitle');
            const loginSubtitle = document.getElementById('loginSubtitle');

            // Reset error borders
            tokenField.style.borderColor = 'var(--border-color)';
            emailField.style.borderColor = 'var(--border-color)';
            passwordField.style.borderColor = 'var(--border-color)';

            if (mode === 'email') {
                tokenContainer.style.display = 'none';
                emailContainer.style.display = 'flex';
                toggleLink.innerText = '使用安全 Token 登录';
                loginTitle.innerText = '紧急邮箱验证';
                loginSubtitle.innerText = '使用您的白名单邮箱和紧急密码安全进入';
                emailField.focus();
            } else {
                tokenContainer.style.display = 'flex';
                emailContainer.style.display = 'none';
                toggleLink.innerText = '使用邮箱密码登录';
                loginTitle.innerText = '需要访问密钥';
                loginSubtitle.innerText = '请输入此云流的安全 Token 进行同步认证';
                tokenField.focus();
            }
        }

        async function handleLoginSubmit() {
            if (loginMode === 'token') {
                const entered = tokenField.value.trim();
                if (!entered) {
                    tokenField.style.borderColor = 'var(--danger-color)';
                    return;
                }
                localStorage.setItem('ics_token', entered);
                token = entered;
                loginModal.style.display = 'none';
                startService();
            } else {
                const email = emailField.value.trim();
                const password = passwordField.value.trim();
                if (!email) {
                    emailField.style.borderColor = 'var(--danger-color)';
                    return;
                }
                if (!password) {
                    passwordField.style.borderColor = 'var(--danger-color)';
                    return;
                }

                emailField.style.borderColor = 'var(--border-color)';
                passwordField.style.borderColor = 'var(--border-color)';
                btnLogin.disabled = true;
                btnLogin.innerText = '正在验证...';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || '验证失败');
                    }

                    const data = await response.json();
                    if (data.status === 'success' && data.token) {
                        localStorage.setItem('ics_token', data.token);
                        token = data.token;
                        loginModal.style.display = 'none';
                        startService();
                    } else {
                        throw new Error('未返回有效 Token');
                    }
                } catch (err) {
                    alert(err.message || '登录验证失败，请检查账户及密码');
                    emailField.style.borderColor = 'var(--danger-color)';
                    passwordField.style.borderColor = 'var(--danger-color)';
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerText = '验证并进入';
                }
            }
        }

        function startService() {
            // Trigger first immediate fetch
            fetchList();

            // Set up polling heartbeat every 3 seconds
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(fetchList, 3000);
        }

        function handleAuthFailure() {
            // Reset local cache on invalid credentials and show overlay again
            localStorage.removeItem('ics_token');
            token = '';
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            tokenField.value = '';
            emailField.value = '';
            passwordField.value = '';
            tokenField.style.borderColor = 'var(--danger-color)';
            loginModal.style.display = 'flex';
            
            if (loginMode === 'email') {
                emailField.focus();
            } else {
                tokenField.focus();
            }
        }

        // Fetch stream list
        async function fetchList() {
            if (isPolling) return;
            isPolling = true;

            try {
                const startTime = Date.now();
                const response = await fetch('/api/list', {
                    headers: { 'X-Auth-Token': token }
                });
                
                if (response.status === 401 || response.status === 403) {
                    handleAuthFailure();
                    return;
                }
                if (!response.ok) throw new Error('同步故障');
                
                const data = await response.json();
                
                // Track dynamic changes without refreshing unchanged elements
                const listHash = JSON.stringify(data.map(m => m.id + m.pinned));
                if (listHash !== lastListHash) {
                    renderTimeline(data);
                    lastListHash = listHash;
                }

                // Update latency indicator
                const latency = Date.now() - startTime;
                statusDot.classList.remove('error');
                statusDot.classList.add('pulse');
                statusText.innerText = `同步成功 (${latency}ms)`;
            } catch (err) {
                console.error(err);
                statusDot.classList.add('error');
                statusDot.classList.remove('pulse');
                statusText.innerText = '离线/链接超时';
            } finally {
                isPolling = false;
            }
        }

        // Render cards stream dynamically
        function renderTimeline(messages) {
            if (messages.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        <p>暂无消息流。您可以粘贴剪贴板文字或拖入文件开始。</p>
                    </div>`;
                return;
            }

            timeline.innerHTML = '';
            messages.forEach(msg => {
                const card = document.createElement('div');
                card.className = `message-card ${msg.pinned ? 'pinned' : ''}`;
                
                // Build meta header
                const header = document.createElement('div');
                header.className = 'card-header';
                
                const metaLeft = document.createElement('div');
                metaLeft.className = 'meta-left';
                metaLeft.innerHTML = `
                    <span class="type-badge ${msg.type}">${msg.type === 'text' ? '文本' : '文件'}</span>
                    <span>${msg.time}</span>
                `;
                
                const metaRight = document.createElement('div');
                metaRight.className = 'meta-right';
                if (msg.pinned) {
                    metaRight.innerHTML = `
                        <svg width="14" height="14" fill="#f59e0b" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="display:inline;">
                            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                        </svg>
                        <span style="color:#f59e0b; font-weight:500;">已置顶</span>
                    `;
                }

                header.appendChild(metaLeft);
                header.appendChild(metaRight);
                card.appendChild(header);

                // Build content block
                const contentBox = document.createElement('div');
                contentBox.className = 'card-content';

                if (msg.type === 'text') {
                    const txtDiv = document.createElement('div');
                    txtDiv.className = 'text-content-box';
                    txtDiv.innerText = msg.content;
                    contentBox.appendChild(txtDiv);
                } else {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-box';
                    
                    const isImg = /\.(gif|jpe?g|tiff?|png|webp|bmp)$/i.test(msg.filename);
                    // Pass Token inside download query param securely
                    const downloadUrl = `/download/${encodeURIComponent(msg.id)}?token=${encodeURIComponent(token)}`;

                    fileDiv.innerHTML = `
                        <div class="file-icon">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div class="file-info">
                            <a href="${downloadUrl}" class="file-name" target="_blank">${msg.filename}</a>
                            <span class="file-size">${msg.size}</span>
                        </div>
                    `;
                    contentBox.appendChild(fileDiv);

                    // Add dynamic image preview
                    if (isImg) {
                        const img = document.createElement('img');
                        img.src = downloadUrl;
                        img.className = 'image-preview';
                        img.alt = msg.filename;
                        img.onclick = () => showLightbox(downloadUrl);
                        contentBox.appendChild(img);
                    }
                }
                card.appendChild(contentBox);

                // Build actions footer
                const actions = document.createElement('div');
                actions.className = 'card-actions';

                // Copy Action for text cards
                if (msg.type === 'text') {
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'btn-action';
                    copyBtn.innerHTML = `
                        <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        <span>复制</span>
                    `;
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(msg.content).then(() => {
                            copyBtn.innerHTML = '<span>已复制 √</span>';
                            copyBtn.style.color = 'var(--success-color)';
                            setTimeout(() => {
                                copyBtn.innerHTML = `
                                    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                                    </svg>
                                    <span>复制</span>`;
                                copyBtn.style.color = '';
                            }, 1500);
                        });
                    };
                    actions.appendChild(copyBtn);
                }

                // Pin / Unpin Action
                const pinBtn = document.createElement('button');
                pinBtn.className = 'btn-action pin-btn';
                pinBtn.innerHTML = msg.pinned ? `
                    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                    <span>取消置顶</span>
                ` : `
                    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                    <span>置顶保护</span>
                `;
                pinBtn.onclick = () => triggerAction(msg.id, msg.pinned ? 'unpin' : 'pin');
                actions.appendChild(pinBtn);

                // Delete Action
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-action delete-btn';
                delBtn.innerHTML = `
                    <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    <span>删除</span>
                `;
                delBtn.onclick = () => {
                    if (confirm('确认删除此卡片？（物理删除不可恢复）')) {
                        triggerAction(msg.id, 'delete');
                    }
                };
                actions.appendChild(delBtn);

                card.appendChild(actions);
                timeline.appendChild(card);
            });
        }

        // Action trigger utility (pin/unpin/delete)
        async function triggerAction(id, actionType) {
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Auth-Token': token
                    },
                    body: JSON.stringify({ id, action: actionType })
                });
                
                if (response.status === 401 || response.status === 403) {
                    handleAuthFailure();
                    return;
                }
                if (!response.ok) throw new Error('操作执行失败');
                fetchList(); // Instant UI sync
            } catch (err) {
                alert(err.message);
            }
        }

        // File Selection attachment UI changes
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                attachedFileName.innerText = fileInput.files[0].name;
                fileBadgeContainer.style.display = 'block';
            }
        });

        btnClearAttachment.addEventListener('click', () => {
            fileInput.value = '';
            fileBadgeContainer.style.display = 'none';
        });

        // Submit push message or file
        pushForm.addEventListener('submit', e => {
            e.preventDefault();
            const text = textInput.value.trim();
            const file = fileInput.files[0];

            if (!text && !file) {
                return;
            }

            const formData = new FormData();
            if (text) formData.append('text', text);
            if (file) formData.append('file', file);

            // Upload using XMLHttpRequest to support rich progress bar
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/push', true);
            
            // Set security token header
            xhr.setRequestHeader('X-Auth-Token', token);

            // Upload progress updates
            xhr.upload.onprogress = e => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressOverlay.style.display = 'block';
                    progressBar.style.width = percent + '%';
                }
            };

            xhr.onload = () => {
                progressOverlay.style.display = 'none';
                progressBar.style.width = '0%';
                
                if (xhr.status === 401 || xhr.status === 403) {
                    handleAuthFailure();
                    return;
                }
                
                if (xhr.status === 201) {
                    // Success resets UI
                    textInput.value = '';
                    fileInput.value = '';
                    fileBadgeContainer.style.display = 'none';
                    fetchList(); // Instant list update
                } else {
                    alert('投送失败: ' + xhr.responseText);
                }
            };

            xhr.onerror = () => {
                progressOverlay.style.display = 'none';
                progressBar.style.width = '0%';
                alert('网络投送故障，请检查连接');
            };

            xhr.send(formData);
        });

        // Textarea keyboard shortcuts: Ctrl + Enter to submit
        textInput.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                pushForm.dispatchEvent(new Event('submit'));
            }
        });

        // Drag and drop event handlers
        window.addEventListener('dragover', e => {
            e.preventDefault();
            dragOverlay.style.display = 'flex';
        });

        window.addEventListener('dragleave', e => {
            if (e.relatedTarget === null) {
                dragOverlay.style.display = 'none';
            }
        });

        window.addEventListener('drop', e => {
            e.preventDefault();
            dragOverlay.style.display = 'none';
            
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });

        // Image Lightbox zoom functions
        function showLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('show');
        }

        lightbox.onclick = () => {
            lightbox.classList.remove('show');
            setTimeout(() => { lightboxImg.src = ''; }, 250);
        };
    </script>
</body>
</html>
